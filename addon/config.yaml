name: "HA Automations Management"
version: "1.0.0b29"
slug: "ha_automations_management"
description: "Organize, quarantine, and back up Home Assistant automations with local Git history"
url: "https://github.com/pawelpp85/ha-automations-management"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
homeassistant_api: true
hassio_api: true
panel_icon: mdi:playlist-edit
panel_title: Automation Manager
icon: icon.png
map:
  - config:rw
  - addon_config:rw
  - backup:rw
options:
  # Periodic import/sync interval in seconds.
  sync_interval_seconds: 300
  # Enable push to external Git remote.
  remote_enabled: false
  # Remote repository URL (SSH or HTTPS).
  remote_url: ""
  # Target branch for manual push.
  remote_branch: "main"
  # Authentication mode for remote push.
  remote_auth_mode: "ssh"
  # SSH private key material used for remote push (optional).
  remote_ssh_key: ""
  # SSH private key encoded as base64 (optional, useful for single-line input fields).
  # Example: base64 < ~/.ssh/id_ed25519 | tr -d '\n'
  remote_ssh_key_base64: ""
  # HTTPS username (optional, used with token).
  remote_https_username: ""
  # HTTPS token or password (optional).
  remote_https_token: ""
  # Author name used for backup commits.
  git_user_name: "HA Automation Manager"
  # Author email used for backup commits.
  git_user_email: "ha-automation-manager@local"
schema:
  sync_interval_seconds: int(30,3600)
  remote_enabled: bool
  remote_url: str?
  remote_branch: str?
  remote_auth_mode: list(ssh|https)
  remote_ssh_key: str?
  remote_ssh_key_base64: str?
  remote_https_username: str?
  remote_https_token: str?
  git_user_name: str
  git_user_email: str
